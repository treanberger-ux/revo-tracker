<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>деРево</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#12161c; --tile:#1b2028; --tile2:#222834; --line:#2b323d;
    --ink:#e8ecf2; --dim:#8d96a5; --gold:#e8c15a; --warn:#d9734f; --ok:#6fb98f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:10px 10px 90px; overflow-x:hidden;
  }
  .card{background:linear-gradient(180deg,#2a3038,#1a1f26);border-radius:14px;
        padding:8px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .t{background:var(--tile);border:1px solid var(--line);border-radius:6px;
     padding:9px 7px;min-height:78px;display:flex;flex-direction:column;
     align-items:center;justify-content:center;text-align:center}
  .t .lab{font-size:8.5px;letter-spacing:.05em;color:var(--dim);
          text-transform:uppercase;line-height:1.25}
  .t .big{font-size:21px;font-weight:700;margin:3px 0 1px;font-variant-numeric:tabular-nums}
  .t .sub{font-size:10px;color:var(--dim)}
  .t.star{background:var(--tile2);font-size:30px}
  .banner{text-align:center;padding:9px 0 3px;font-size:17px;font-weight:600;color:var(--gold)}
  h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
     margin:20px 0 8px;font-weight:600}
  .row{display:flex;gap:8px}
  button{flex:1;background:var(--tile);color:var(--ink);border:1px solid var(--line);
         border-radius:11px;padding:13px 10px;font-size:14px;font-weight:600;font-family:inherit}
  button:active{transform:scale(.98)}
  button.warn{background:#3a2119;border-color:#5d3325;color:#f0a184}
  button.on{background:#1d3329;border-color:#2f5a45;color:var(--ok)}
  .sens{background:var(--tile);border:1px solid var(--line);border-radius:11px;padding:11px}
  .meter{height:7px;background:#0e1116;border-radius:4px;overflow:hidden;margin:9px 0 4px;position:relative}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .07s linear}
  .meter u{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);left:46.7%}
  .st{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  video{width:100%;border-radius:9px;background:#000;display:block;margin-top:8px}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:10px;
        background:linear-gradient(180deg,transparent,var(--bg) 30%)}
</style>
</head>
<body>

<div class="card">
  <div class="grid" id="grid"></div>
  <div class="banner" id="banner">Пока ни глотка</div>
</div>

<h2>Сигналы извне</h2>
<div class="sens">
  <div class="row">
    <button id="bMic">Слушать сёрбанье</button>
    <button id="bCam">Смотреть в камеру</button>
  </div>
  <div class="meter"><i id="meter"></i><u></u></div>
  <div class="st"><span id="stMic">микрофон выключен</span><span id="stCam">камера выключена</span></div>
  <video id="v" playsinline muted hidden></video>
  <canvas id="c" hidden></canvas>
</div>

<div class="foot">
  <div class="row">
    <button class="warn" id="bDrank">Сёрбнул</button>
    <button id="bReset">Начать заново</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Числа банки 0,5 л. Не замерены, поставлены разумными.
const ЦЕНА = 1.6, ОБЪЁМ = 500, КОФЕИН = 150, САХАР = 55;
const ПОРОГ_ДБ = 14;          // всплеск над фоном, при котором глоток засчитан

const store = {
  async get(k){
    if (tg?.CloudStorage?.getItem)
      return new Promise(r => tg.CloudStorage.getItem(k, (e,v) => r(e ? null : v)));
    return localStorage.getItem(k);
  },
  async set(k,v){
    if (tg?.CloudStorage?.setItem) return new Promise(r => tg.CloudStorage.setItem(k, v, () => r()));
    localStorage.setItem(k,v);
  }
};

const D = { drank: 0, confirmed: 0, last: 0 };
const el = id => document.getElementById(id);

async function load(){
  const raw = await store.get('revo');
  if (raw) { try { Object.assign(D, JSON.parse(raw)); } catch(e){} }
}
const save = () => store.set('revo', JSON.stringify(D));

// ---------- звук глотка: случайный клип, плавный вход и затухание
let ac = null, клипы = [], звукГотов = false;
function контекст(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
async function грузитьЗвук(){
  if (звукГотов) return;
  const c = контекст();
  const адреса = [1,2,3,4,5,6].map(i => `sfx/sip${i}.mp3`);
  клипы = (await Promise.all(адреса.map(async a => {
    try { return await c.decodeAudioData(await (await fetch(a)).arrayBuffer()); }
    catch(e){ return null; }
  }))).filter(Boolean);
  звукГотов = клипы.length > 0;
}
// Клип длиннее двух секунд играется двухсекундным куском со случайного места:
// так сюда можно положить лицензированную музыку, ничего не меняя в коде.
function сыграть(){
  if (!звукГотов) return;
  const c = контекст();
  const b = клипы[Math.floor(Math.random() * клипы.length)];
  const дл = Math.min(b.duration, 2.0);
  const запас = Math.max(0, b.duration - дл);
  const старт = запас > 0 ? Math.random() * запас : 0;
  const вход = Math.min(0.25, дл * 0.2), уход = Math.min(0.45, дл * 0.35);
  const t = c.currentTime;
  const src = c.createBufferSource(); src.buffer = b;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1, t + вход);
  g.gain.setValueAtTime(1, t + Math.max(вход, дл - уход));
  g.gain.exponentialRampToValueAtTime(0.0001, t + дл);
  src.connect(g).connect(c.destination);
  src.start(t, старт, дл);
  src.stop(t + дл + 0.05);
}

// ---------- карточка
function fmtDur(ms){
  const m = Math.floor(ms/60000), d = Math.floor(m/1440);
  const h = Math.floor((m%1440)/60), mm = m%60;
  return [d, String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0')];
}
function render(){
  const n = D.drank;
  const [days, hhmm] = D.last ? fmtDur(Date.now() - D.last) : [0, '00:00'];
  const tiles = [
    ['выпито<br>рево', n, 'банок'],
    ['с последнего<br>глотка', days, hhmm],
    ['потрачено<br>денег', (n*ЦЕНА).toFixed(1), 'евро'],
    ['получено<br>сахара', (n*САХАР).toFixed(0), 'грамм'],
    ['получено<br>кофеина', (n*КОФЕИН).toFixed(0), 'миллиграмм'],
    ['выпито<br>жидкости', (n*ОБЪЁМ/1000).toFixed(1), 'литра'],
    ['часов сна<br>долой', (n*КОФЕИН/100*1.2).toFixed(0), 'часов'],
  ];
  el('grid').innerHTML = tiles.map(([l,b,s]) =>
    `<div class="t"><div class="lab">${l}</div><div class="big">${b}</div><div class="sub">${s}</div></div>`
  ).join('') + `<div class="t star">${n === 0 ? '⭐' : (n < 4 ? '\u{1F979}' : '\u{1F92F}')}</div>`;

  el('banner').textContent = n === 0
    ? 'Пока ни глотка'
    : `Сёрбнуто ${n}, из них подтверждено камерой ${D.confirmed}`;
}

function drank(confirmed){
  D.drank += 1; D.last = Date.now();
  if (confirmed) D.confirmed += 1;
  сыграть();
  tg?.HapticFeedback?.notificationOccurred?.('warning');
  save(); render();
}

// ---------- звук: всплеск в полосе 1,5-6 кГц
let an, buf, micOn = false, lastSip = 0, riseAt = 0, floorDb = -80;
async function toggleMic(){
  if (micOn) { micOn = false; el('bMic').classList.remove('on');
               el('stMic').textContent = 'микрофон выключен'; return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const c = контекст();
    an = c.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.25;
    c.createMediaStreamSource(s).connect(an);
    buf = new Float32Array(an.frequencyBinCount);
    micOn = true; el('bMic').classList.add('on'); el('stMic').textContent = 'слушаю';
    loopAudio();
  } catch(e){ el('stMic').textContent = 'микрофон не дали: ' + e.name; }
}
function loopAudio(){
  if (!micOn) return;
  an.getFloatFrequencyData(buf);
  const hz = ac.sampleRate / an.fftSize;
  const a = Math.round(1500/hz), b = Math.round(6000/hz);
  let sum = 0; for (let i=a;i<b;i++) sum += buf[i];
  const db = sum/(b-a);
  floorDb = floorDb*0.995 + db*0.005;
  const over = db - floorDb;
  el('meter').style.width = Math.max(0, Math.min(100, (over/30)*100)) + '%';

  const now = performance.now();
  if (over > ПОРОГ_ДБ) { if (!riseAt) riseAt = now; }
  else if (riseAt) {
    const dur = now - riseAt; riseAt = 0;
    if (dur > 100 && dur < 1200 && now - lastSip > 2500) {
      lastSip = now; drank(now - lastSeen < 4000);
    }
  }
  requestAnimationFrame(loopAudio);
}

// ---------- камера: ищем банку или стакан
let camOn = false, model = null, lastSeen = -1e9;
async function toggleCam(){
  if (camOn) { el('v').srcObject?.getTracks().forEach(t=>t.stop()); camOn = false;
               el('v').hidden = true; el('bCam').classList.remove('on');
               el('stCam').textContent = 'камера выключена'; return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    el('v').srcObject = s; el('v').hidden = false; await el('v').play();
    camOn = true; el('bCam').classList.add('on'); el('stCam').textContent = 'гружу модель';
    if (!model) {
      await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
      model = await cocoSsd.load({base:'lite_mobilenet_v2'});
    }
    el('stCam').textContent = 'смотрю';
    loopCam();
  } catch(e){ el('stCam').textContent = 'камера не дала: ' + e.name; }
}
function loadScript(src){
  return new Promise((res,rej) => { const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
const ЦЕЛИ = ['bottle','cup','wine glass'];
async function loopCam(){
  if (!camOn) return;
  const v = el('v'), c = el('c');
  if (v.videoWidth) {
    c.width = 320; c.height = 320 * v.videoHeight / v.videoWidth;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    try {
      const p = await model.detect(c, 5, 0.45);
      const hit = p.find(x => ЦЕЛИ.includes(x.class));
      if (hit) { lastSeen = performance.now(); el('stCam').textContent = 'вижу: ' + hit.class; }
      else el('stCam').textContent = 'смотрю';
    } catch(e){}
  }
  setTimeout(loopCam, 600);
}

// ---------- кнопки
el('bMic').onclick = () => { грузитьЗвук(); toggleMic(); };
el('bCam').onclick = () => { грузитьЗвук(); toggleCam(); };
el('bDrank').onclick = async () => { await грузитьЗвук(); drank(false); };
el('bReset').onclick = () => { D.drank = 0; D.confirmed = 0; D.last = 0; save(); render(); };

load().then(() => { render(); setInterval(render, 30000); });
</script>
</body>
</html>
